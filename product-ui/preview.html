/* ===== Preview only. Every colour, size and duration below is a token. ===== */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ds-surface-canvas); color: var(--ds-ink); -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--ds-appbar-height) + 64px); }
body { margin: 0; font-family: var(--ds-font-body); font-size: var(--ds-type-body-size); line-height: var(--ds-type-body-leading); }
:where([dir]:not(html, bdi)) { font-family: var(--ds-font-body); } /* a nested dir region re-resolves the swapped family */
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; }
.i { width: var(--ds-icon-size); height: var(--ds-icon-size); flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.s20 { width: 20px; height: 20px; }
.i.s16 { width: 16px; height: 16px; }
.i.fill { fill: currentColor; stroke: none; }
[dir="rtl"] .flip { transform: scaleX(-1); }
:focus-visible { outline: var(--ds-focus-width) solid var(--ds-focus); outline-offset: var(--ds-focus-offset); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.meta { font-size: var(--ds-type-meta-size); line-height: var(--ds-type-meta-leading); color: var(--ds-ink-muted); }
.num { font-variant-numeric: var(--ds-type-numeric); }
.t-display, .t-headline, .t-title-1, .t-title-2, .t-title-3, .t-figure { font-family: var(--ds-font-heading); color: var(--ds-ink-strong); }
.t-display { font-size: var(--ds-type-display-size); line-height: var(--ds-type-display-leading); font-weight: var(--ds-type-display-weight); letter-spacing: var(--ds-type-display-tracking); }
.t-headline { font-size: var(--ds-type-headline-size); line-height: var(--ds-type-headline-leading); font-weight: var(--ds-type-headline-weight); letter-spacing: var(--ds-type-headline-tracking); }
.t-title-1 { font-size: var(--ds-type-title-1-size); line-height: var(--ds-type-title-1-leading); font-weight: var(--ds-type-title-1-weight); letter-spacing: var(--ds-type-title-1-tracking); }
.t-title-2 { font-size: var(--ds-type-title-2-size); line-height: var(--ds-type-title-2-leading); font-weight: var(--ds-type-title-2-weight); letter-spacing: var(--ds-type-title-2-tracking); }
.t-title-3 { font-size: var(--ds-type-title-3-size); line-height: var(--ds-type-title-3-leading); font-weight: var(--ds-type-title-3-weight); }
.t-figure { font-size: var(--ds-type-figure-size); line-height: var(--ds-type-figure-leading); font-weight: var(--ds-type-figure-weight); letter-spacing: var(--ds-type-figure-tracking); font-variant-numeric: var(--ds-type-numeric); }
.t-lead { font-size: var(--ds-type-lead-size); line-height: var(--ds-type-lead-leading); font-weight: var(--ds-type-lead-weight); }
.t-body { font-size: var(--ds-type-body-size); line-height: var(--ds-type-body-paragraph-leading); }
.t-label { font-size: var(--ds-type-label-size); line-height: var(--ds-type-label-leading); font-weight: var(--ds-type-label-weight); }
.t-meta { font-size: var(--ds-type-meta-size); line-height: var(--ds-type-meta-leading); }

/* ----- page chrome ----- */
.top { position: sticky; top: 0; z-index: var(--ds-z-appbar); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; min-height: var(--ds-appbar-height); padding: 8px 24px; box-shadow: inset 0 -1px 0 0 var(--ds-line); }
.top h1 { display: flex; align-items: baseline; gap: 12px; }
.ver { font-family: var(--ds-font-body); font-size: var(--ds-type-meta-size); font-weight: 500; color: var(--ds-ink-muted); letter-spacing: 0; }
.tools { display: flex; align-items: center; gap: 12px; margin-inline-start: auto; }
.panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 36rem), 1fr)); }
.pane { min-width: 0; background: var(--ds-surface-canvas); color: var(--ds-ink); }
.pane + .pane { border-inline-start: 1px solid var(--ds-line); }
.pane-head { position: sticky; top: var(--ds-appbar-height); z-index: var(--ds-z-sticky); display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 32px; border-bottom: 1px solid var(--ds-line); color: var(--ds-ink-strong); }
.pane-head code { margin-inline-start: auto; }
code { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: var(--ds-type-meta-size); color: var(--ds-ink-muted); }
.sec { padding: 40px 32px 8px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.sec-h .n { font-size: var(--ds-type-meta-size); color: var(--ds-ink-muted); font-variant-numeric: var(--ds-type-numeric); }
.sec-h::after { content: ""; flex: 1; height: 1px; background: var(--ds-line); align-self: center; }
.sub { margin: 28px 0 12px; font-weight: 600; color: var(--ds-ink-strong); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ds-cluster-gap); }
.stack { display: grid; gap: var(--ds-stack-gap); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 16px; }
.panel { background: var(--ds-surface-base); border: 1px solid var(--ds-line); border-radius: var(--ds-radius-panel); padding: var(--ds-panel-pad); min-width: 0; }
.panel-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }

/* ----- roles ----- */
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.25rem, 1fr)); gap: 12px; }
.swatch { display: grid; grid-template-rows: 64px auto; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-panel); background: var(--ds-surface-base); overflow: hidden; }
.swatch > i { display: grid; place-items: center; background: var(--c); border-bottom: 1px solid var(--ds-line); font-style: normal; font-weight: 600; color: var(--on, transparent); }
.swatch > span { display: grid; padding: 8px 12px 10px; }
.swatch b { font-weight: 500; }

/* ----- actions ----- */
.btn { --bg: var(--ds-ink-action); --fg: var(--ds-ink-action-on); --bd: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--ds-control-height); min-width: var(--ds-target-min); padding: 0 var(--ds-control-pad-x); border: 1px solid var(--bd); border-radius: var(--ds-radius-control); background: var(--bg); color: var(--fg); font-size: var(--ds-type-label-size); font-weight: var(--ds-type-label-weight); line-height: 1; white-space: nowrap; cursor: pointer; box-shadow: var(--ds-rim); text-decoration: none; }
.btn:hover { --bg: var(--ds-ink-action-hover); }
.btn.user { --bg: var(--ds-user); --fg: var(--ds-user-on); }
.btn.user:hover { --bg: var(--ds-user-hover); }
.btn.user:active { --bg: var(--ds-user-pressed); }
.btn.soft { --bg: var(--ds-surface-sunken); --fg: var(--ds-ink); box-shadow: none; }
.btn.soft:hover { --bg: var(--ds-surface-hover); }
.btn.outline { --bg: transparent; --fg: var(--ds-ink); --bd: var(--ds-line-strong); box-shadow: none; }
.btn.outline:hover { --bg: var(--ds-surface-hover); }
.btn.link { --bg: transparent; --fg: var(--ds-ink); box-shadow: none; padding: 0 8px; text-decoration: underline; text-underline-offset: 4px; }
.btn.link:hover { --bg: transparent; text-decoration-thickness: 2px; }
.btn.danger { --bg: var(--ds-error-solid); --fg: var(--ds-error-on); }
.btn.danger:hover { --bg: var(--ds-error-solid-hover); }
.btn.ghost { --bg: transparent; --fg: var(--ds-ink); box-shadow: none; }
.btn.ghost:hover { --bg: var(--ds-surface-hover); }
.btn.icon { padding: 0; width: var(--ds-control-height); }
.btn[aria-pressed="true"], .btn[aria-pressed="true"]:hover { --bg: var(--ds-user-soft); --fg: var(--ds-ink-strong); --bd: var(--ds-user-line); }
.btn .dot { position: absolute; inset-block-start: 9px; inset-inline-end: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--ds-error-solid); box-shadow: 0 0 0 2px var(--ds-surface-base); }
.btn.icon { position: relative; }
kbd { font-family: inherit; font-size: var(--ds-type-meta-size); line-height: 20px; padding: 0 6px; border: 1px solid var(--ds-line-strong); border-radius: var(--ds-radius-xs); color: var(--ds-ink-muted); }

/* ----- app bar ----- */
.appbar { display: flex; align-items: center; gap: 12px; min-height: var(--ds-appbar-height); padding: 0 12px; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-panel); }
.mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--ds-radius-control); background: var(--ds-neutral-0); color: var(--ds-neutral-900); box-shadow: inset 0 0 0 1px var(--ds-neutral-100); }
.appbar .name { font-family: var(--ds-font-heading); font-weight: 700; color: var(--ds-ink-strong); white-space: nowrap; }
.search { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; min-height: var(--ds-target-min); padding: 0 8px 0 12px; border: 1px solid var(--ds-line-strong); border-radius: var(--ds-radius-control); background: var(--ds-surface-base); color: var(--ds-ink-muted); cursor: text; }
.search span { flex: 1; text-align: start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ds-surface-sunken); color: var(--ds-ink-strong); font-weight: 600; box-shadow: 0 0 0 2px var(--ds-surface-base), 0 0 0 4px var(--ds-user); flex: none; margin-inline: 4px; }

/* ----- segmented ----- */
.seg { --pad: min(4px, calc((var(--ds-control-height) - var(--ds-target-min)) / 2)); position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; min-width: max-content; height: var(--ds-control-height); padding: var(--pad); border-radius: var(--ds-radius-control); background: var(--ds-surface-sunken); box-shadow: inset 0 0 0 1px var(--ds-line); isolation: isolate; }
.seg .thumb { position: absolute; z-index: -1; top: var(--pad); bottom: var(--pad); inset-inline-start: calc(var(--pad) + (100% - 2 * var(--pad)) / var(--n) * var(--k)); width: calc((100% - 2 * var(--pad)) / var(--n)); border-radius: calc(var(--ds-radius-control) - var(--pad)); background: var(--ds-user-soft); box-shadow: inset 0 0 0 1px var(--ds-user-line), var(--ds-elevation-raised); }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: var(--ds-target-min); min-height: calc(var(--ds-control-height) - 2 * var(--pad)); padding: 0 14px; border: 0; border-radius: calc(var(--ds-radius-control) - var(--pad)); background: none; color: var(--ds-ink-muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg.icons button { padding: 0 10px; }
.seg button:hover { color: var(--ds-ink-strong); }
.seg button[aria-checked="true"] { color: var(--ds-ink-strong); font-weight: 600; }
.seg button:focus-visible { outline-offset: -2px; }

/* ----- chips, badges ----- */
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: var(--ds-target-min); padding: 0 16px; border: 1px solid var(--ds-line-strong); border-radius: var(--ds-radius-chip); background: var(--ds-surface-base); color: var(--ds-ink); font-weight: 500; cursor: pointer; }
.chip:hover { background: var(--ds-surface-hover); }
.chip[aria-pressed="true"] { background: var(--ds-user-soft); border-color: var(--ds-user-line); color: var(--ds-ink-strong); }
.chip[aria-pressed="false"] .i { display: none; }
.chip.applied { cursor: default; padding-inline-end: 8px; background: var(--ds-surface-sunken); border-color: var(--ds-line); }
.chip .x { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; }
.chip .x:hover { background: var(--ds-surface-pressed); }
.badge { --b: var(--ds-surface-sunken); --f: var(--ds-ink); --l: var(--ds-ink-muted); display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 10px; border-radius: var(--ds-radius-xs); background: var(--b); color: var(--f); font-weight: 500; white-space: nowrap; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--l); }
.badge.success { --b: var(--ds-success-soft); --f: var(--ds-success-fg); --l: var(--ds-success-line); }
.badge.info { --b: var(--ds-info-soft); --f: var(--ds-info-fg); --l: var(--ds-info-line); }
.badge.warning { --b: var(--ds-warning-soft); --f: var(--ds-warning-fg); --l: var(--ds-warning-line); }
.badge.error { --b: var(--ds-error-soft); --f: var(--ds-error-fg); --l: var(--ds-error-line); }
.mchip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px; border-radius: var(--ds-radius-chip); background: var(--ds-machine-soft); color: var(--ds-machine-ink); font-weight: 500; white-space: nowrap; }

/* ----- forms ----- */
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lbl { font-weight: var(--ds-type-label-weight); color: var(--ds-ink-strong); }
.input { width: 100%; min-height: var(--ds-control-height); padding: 0 var(--ds-field-pad-x); border: 1px solid var(--ds-line-strong); border-radius: var(--ds-radius-control); background: var(--ds-surface-base); color: var(--ds-ink); font: inherit; }
.input::placeholder { color: var(--ds-ink-muted); }
.input:focus-visible { outline-offset: 0; }
.input[aria-invalid="true"] { border-color: var(--ds-error-line); box-shadow: inset 0 0 0 1px var(--ds-error-line); }
.err { display: flex; align-items: flex-start; gap: 8px; color: var(--ds-error-text); }
.err .i { margin-top: 2px; }
.check { display: inline-flex; align-items: center; gap: 12px; min-height: var(--ds-target-min); cursor: pointer; }
.cbx { appearance: none; -webkit-appearance: none; display: grid; place-content: center; flex: none; width: var(--ds-check-size); height: var(--ds-check-size); margin: 0; border: 1.5px solid var(--ds-line-strong); border-radius: var(--ds-radius-xs); background: var(--ds-surface-base); cursor: pointer; }
.cbx::before { content: ""; width: 12px; height: 12px; background: var(--ds-user-on); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transform: scale(0); transition: transform var(--ds-duration-state) var(--ds-ease-standard); }
.cbx:checked, .cbx:indeterminate { background: var(--ds-user); border-color: var(--ds-user); }
.cbx:checked::before { transform: scale(1); }
.cbx:indeterminate::before { clip-path: inset(40% 8%); transform: scale(1); }
.cbx:focus-visible { outline-offset: 2px; }
.toggle { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 44px; height: 24px; margin: 0; border: 1.5px solid var(--ds-line-strong); border-radius: 999px; background: var(--ds-surface-base); cursor: pointer; transition: background-color var(--ds-duration-state) var(--ds-ease-standard), border-color var(--ds-duration-state) var(--ds-ease-standard); }
.toggle::before { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ds-line-strong); transition: transform var(--ds-duration-state) var(--ds-ease-standard), background-color var(--ds-duration-state) var(--ds-ease-standard); }
.toggle:checked { background: var(--ds-user); border-color: var(--ds-user); }
.toggle:checked::before { background: var(--ds-user-on); transform: translateX(calc(20px * var(--ds-dir))); }

/* ----- table ----- */
.tbl-wrap { --head-h: 48px; max-height: calc(var(--ds-row-height) * 5.5); overflow: auto; scroll-padding-top: calc(var(--head-h) + var(--ds-focus-width) + var(--ds-focus-offset)); border: 1px solid var(--ds-line); border-radius: var(--ds-radius-panel); background: var(--ds-surface-base); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: var(--ds-type-numeric); }
.tbl th, .tbl td { height: var(--ds-row-height); padding: 0 var(--ds-cell-pad-x); border-bottom: 1px solid var(--ds-line); text-align: start; white-space: nowrap; }
.tbl thead th { position: sticky; top: 0; z-index: 1; height: var(--head-h); font-weight: 500; color: var(--ds-ink-muted); }
.tbl tbody th { font-weight: 500; color: var(--ds-ink-strong); }
.tbl tbody tr:hover > * { background: var(--ds-surface-hover); }
.tbl tbody tr.is-chosen > * { background: var(--ds-user-soft); }
.tbl tbody tr.is-chosen > :first-child { box-shadow: inset calc(3px * var(--ds-dir)) 0 0 var(--ds-user-line); }
.tbl tr:last-child > * { border-bottom: 0; }
.tbl .c-sel { width: 48px; padding-inline-end: 0; }
.tbl .c-sel .cbx { position: relative; }
.tbl .c-sel .cbx::after { content: ""; position: absolute; inset-block-start: 50%; inset-inline-start: 50%; width: var(--ds-target-min); height: var(--ds-target-min); transform: translate(calc(-50% * var(--ds-dir)), -50%); }
.tbl .c-num { text-align: end; }
.tbl .c-act { width: 56px; padding: 0 8px; text-align: end; }
.tbl .c-act .btn { width: 40px; min-height: 40px; opacity: 0; }
.tbl tr:hover .c-act .btn, .tbl tr:focus-within .c-act .btn { opacity: 1; }
@media (hover: none), (pointer: coarse) { .tbl .c-act .btn { opacity: 1; } }
.tbl-wrap:focus-visible { outline-offset: 2px; }
.bulk { display: flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 6px 6px 16px; padding-inline: 16px 6px; border-radius: var(--ds-radius-control); }
.bulk[hidden] { display: none; }
.bulk .count { flex: 1; font-weight: 500; font-variant-numeric: var(--ds-type-numeric); }
.bulk button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 40px; padding: 0 12px; border: 0; border-radius: calc(var(--ds-radius-control) - 2px); background: none; color: inherit; font-weight: 500; cursor: pointer; }
.bulk button:hover { background: color-mix(in srgb, var(--ds-ink-inverse) 14%, transparent); }
.bulk .danger { color: var(--ds-error-on-inverse); }

/* ----- dashboard ----- */
.kpi { display: grid; gap: 8px; align-content: start; }
.kpi .lbl { font-weight: 500; color: var(--ds-ink-muted); }
.delta { display: inline-flex; align-items: center; gap: 6px; color: var(--ds-success-fg); font-weight: 500; }
.delta .i { color: var(--ds-data-pos); }
.delta.down { color: var(--ds-error-fg); }
.delta.down .i { color: var(--ds-data-neg); transform: rotate(180deg); }
.spark { width: 100%; height: auto; overflow: visible; }
.spark polyline { fill: none; stroke: var(--ds-machine); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--ds-machine); stroke: var(--ds-surface-base); stroke-width: 3; }
.meter { position: relative; height: 8px; margin-top: 8px; border-radius: 999px; background: var(--ds-data-track); }
.meter > i { position: absolute; inset-block: 0; inset-inline-start: 0; width: calc(var(--v) * 1%); border-radius: inherit; background: var(--ds-machine); }
.meter > b { position: absolute; top: -4px; bottom: -4px; inset-inline-start: calc(var(--t) * 1%); width: 2px; background: var(--ds-data-4); border-radius: 1px; }
.chart { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; padding-top: 12px; }
.ticks { position: relative; height: 160px; min-width: 3ch; font-size: var(--ds-type-meta-size); line-height: 1; color: var(--ds-ink-muted); font-variant-numeric: var(--ds-type-numeric); }
.ticks span { position: absolute; inset-inline-end: 0; top: calc(var(--p) * 1%); transform: translateY(-50%); }
.plot { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; gap: 14px; height: 160px; padding: 0 6px; border-bottom: 1px solid var(--ds-line-strong); background: linear-gradient(var(--ds-data-grid) 1px, transparent 1px) 0 0 / 100% 20%; }
.plot > i { height: calc(var(--v) * 1%); min-height: 2px; border-radius: 6px 6px 2px 2px; background: var(--ds-data-1); }
.plot > i.you { background: var(--ds-data-user); }
.xl { grid-column: 2; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; padding: 0 6px; text-align: center; font-size: var(--ds-type-meta-size); line-height: var(--ds-type-meta-leading); color: var(--ds-ink-muted); }
.xl .you { color: var(--ds-ink-strong); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.key { width: 12px; height: 12px; border-radius: 3px 3px 2px 2px; background: var(--k); }
.insight { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 16px; padding: 20px var(--ds-panel-pad) var(--ds-panel-pad); border: 1px solid var(--ds-line); border-radius: var(--ds-radius-panel); background: var(--ds-surface-base); overflow: hidden; }
.insight .ds-sweep { position: absolute; inset-inline: 0; top: 0; }
.disc { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ds-machine-soft); color: var(--ds-machine-ink); }
.insight .body { display: grid; gap: 8px; }
.insight .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: -8px; }

/* ----- feedback ----- */
.alert { --b: var(--ds-info-soft); --f: var(--ds-info-fg); --l: var(--ds-info-line); display: flex; gap: 12px; padding: 12px 16px; border-radius: var(--ds-radius-control); background: var(--b); color: var(--ds-ink); box-shadow: inset calc(4px * var(--ds-dir)) 0 0 var(--l); }
.alert .i { color: var(--f); margin-top: 0; }
.alert b { color: var(--f); font-weight: 600; }

.card { width: 100%; max-width: 15rem; padding: 16px 18px; border-radius: var(--ds-radius-panel); }
.card.flat { background: var(--ds-surface-base); border: 1px solid var(--ds-line); }

.card .bar.w2 { width: 70%; }
.menu { width: 100%; max-width: 15rem; padding: 6px; border-radius: var(--ds-radius-control); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--ds-target-min); padding: 0 12px; border: 0; border-radius: calc(var(--ds-radius-control) - 4px); background: none; color: var(--ds-ink); text-align: start; cursor: pointer; }

.scene { position: absolute; inset: 0; padding: 20px; display: grid; gap: 10px; align-content: start; }
.scene i { display: block; height: 12px; border-radius: 999px; background: var(--ds-data-track); }
.scene i:nth-child(2n) { width: 70%; }
.scrim { position: absolute; inset: 0; background: var(--ds-scrim); }
.dialog { position: relative; width: 100%; max-width: 17rem; padding: 20px; border-radius: var(--ds-radius-overlay); }
.dialog .row { justify-content: flex-end; margin-top: 16px; }
.veil-scroll { position: relative; width: 100%; height: 200px; overflow: auto; border-radius: var(--ds-radius-control); background: var(--ds-surface-base); border: 1px solid var(--ds-line); }
.veil-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid var(--ds-line); font-weight: 600; color: var(--ds-ink-strong); }
.veil-scroll .content { display: grid; gap: 10px; padding: 16px; }

/* ----- motion ----- */
.dur { display: grid; gap: 10px; }
.dur > div { display: grid; grid-template-columns: 11rem minmax(0, 1fr) 4.5rem; align-items: center; gap: 12px; }
.dur code { color: var(--ds-ink); }
.track { position: relative; height: 24px; }
.track::before { content: ""; position: absolute; inset-inline: 0; top: 11px; height: 2px; border-radius: 2px; background: var(--ds-line); }
.track > s { position: absolute; top: 11px; height: 2px; inset-inline-start: 0; width: calc(var(--w) * 1%); background: var(--ds-line-strong); border-radius: 2px; }
.track > b { position: absolute; top: 4px; inset-inline-start: 0; width: 16px; height: 16px; margin-inline-start: -8px; border-radius: 50%; background: var(--ds-machine); box-shadow: 0 0 0 3px var(--ds-surface-canvas); transition-property: inset-inline-start; transition-duration: var(--d); transition-timing-function: var(--e); }
.dur.go .track > b { inset-inline-start: calc(var(--w) * 1%); }
.demos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 16px; margin-top: 24px; }
.demo { position: relative; min-height: 180px; padding: 16px; border-radius: var(--ds-radius-panel); background: var(--ds-surface-sunken); overflow: hidden; }
.demo .menu { position: absolute; top: 72px; inset-inline-start: 16px; max-width: 12rem; }
.drawer { position: absolute; inset-block: 0; inset-inline-end: 0; width: 54%; padding: 16px; border-start-start-radius: var(--ds-radius-overlay); border-end-start-radius: var(--ds-radius-overlay); }
.drawer .bar { height: 10px; margin-top: 12px; border-radius: 999px; background: var(--ds-data-track); }
.mini-bars { display: flex; align-items: flex-end; gap: 10px; height: 110px; margin-top: 12px; border-bottom: 1px solid var(--ds-line-strong); }
.mini-bars i { flex: 1; height: calc(var(--v) * 1%); border-radius: 5px 5px 2px 2px; background: var(--ds-data-1); }
.mini-bars i.you { background: var(--ds-data-user); }

/* ----- focus and targets ----- */
.ring { outline: var(--ds-focus-width) solid var(--ds-focus); outline-offset: var(--ds-focus-offset); }
.ring.o0 { outline-offset: 0; }
.ring.in { outline-offset: -2px; }
.focus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: 20px; align-items: end; }
.focus-grid > div { display: grid; gap: 10px; justify-items: start; }
.hit { position: relative; display: inline-grid; place-items: center; }
.hit::after { content: ""; position: absolute; inset: 0; border: 1.5px dashed var(--ds-focus); border-radius: 4px; pointer-events: none; }
.hit.clear::before { content: ""; position: absolute; inset: -8px; border: 1px dotted var(--ds-line-strong); border-radius: 6px; pointer-events: none; }

/* ----- RTL ----- */
.rtl-demo { display: grid; gap: 16px; }
.progress { height: 8px; border-radius: 999px; background: var(--ds-data-track); overflow: hidden; }
.progress > i { display: block; width: 72%; height: 100%; border-radius: inherit; background: var(--ds-machine); }

/* ----- contrast ----- */
.cr { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 0 20px; }
.cr > div { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 56px; padding: 6px 0; border-bottom: 1px solid var(--ds-line); line-height: 1.35; }
.cr .aa { display: grid; place-items: center; width: 44px; height: 32px; border-radius: var(--ds-radius-sm); font-weight: 700; box-shadow: inset 0 0 0 1px var(--ds-line); }
.cr .aa.g { font-size: 0; }
.cr .aa.g::before { content: ""; width: 20px; height: 20px; border-radius: 4px; background: var(--fg); }
.cr .v { font-weight: 600; color: var(--ds-ink-strong); font-variant-numeric: var(--ds-type-numeric); }
.cr .fail { color: var(--ds-error-text); }
.cr-note { margin-top: 12px; }

/* ----- fonts ----- */
.fonts { padding: 40px 32px 56px; border-top: 1px solid var(--ds-line); }
.fonts table { width: 100%; border-collapse: collapse; }
.fonts th, .fonts td { padding: 12px 16px 12px 0; padding-inline: 0 16px; border-bottom: 1px solid var(--ds-line); text-align: start; vertical-align: baseline; }
.fonts thead th { font-weight: 500; color: var(--ds-ink-muted); }
.fonts .sample { font-size: 1.25rem; color: var(--ds-ink-strong); }

@media (max-width: 40rem) {

  .pane-head, .sec, .fonts { padding-inline: 16px; }
  .pane-head { top: 0; position: relative; }

  .fonts table { display: block; overflow-x: auto; }
}
</style>

<script>
(function () {
  var panes = [
    { el: document.getElementById('pane-light'), p: 'l', name: 'Light', icon: 'sun', attr: 'default' },
    { el: document.getElementById('pane-dark'), p: 'd', name: 'Dark', icon: 'moon', attr: 'data-ds-theme="dark"' }
  ];
  var tpl = document.getElementById('pane-tpl').innerHTML;
  panes.forEach(function (x) {
    x.el.innerHTML = tpl.replace(/\{p\}/g, x.p).replace(/\{name\}/g, x.name).replace(/\{icon\}/g, x.icon).replace(/\{attr\}/g, x.attr.replace(/"/g, '&quot;'));
  });

  /* ---- colour maths: resolve a role in a pane, composite translucent values, WCAG ratio ---- */
  function tok(el, name) { return getComputedStyle(el).getPropertyValue('--ds-' + name).trim(); }
  function rgb(h) { h = h.replace('#', ''); return [0, 2, 4, 6].map(function (i) { return i < h.length ? parseInt(h.substr(i, 2), 16) : 255; }); }
  function over(fg, bg) { var f = rgb(fg), b = rgb(bg), a = f[3] / 255; return '#' + [0, 1, 2].map(function (i) { return ('0' + Math.round(f[i] * a + b[i] * (1 - a)).toString(16)).slice(-2); }).join('').toUpperCase(); }
  function lum(h) { return rgb(h).slice(0, 3).map(function (c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }).reduce(function (s, c, i) { return s + c * [0.2126, 0.7152, 0.0722][i]; }, 0); }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function solid(el, name) {
    var v = tok(el, name);
    if (name === 'surface-float') return over(tok(el, 'tint-float'), v);
    return v.length > 7 ? over(v, tok(el, 'surface-base')) : v;
  }

  var swatches = [
    ['surface-canvas'], ['surface-sunken'], ['surface-base'], ['surface-float'], ['surface-inverse', 'ink-inverse'],
    ['surface-hover'], ['ink'], ['ink-strong'], ['ink-muted'], ['line'], ['line-strong'], ['ink-action', 'ink-action-on'],
    ['user', 'user-on'], ['user-soft', 'user-ink'], ['machine'], ['machine-soft', 'machine-ink'], ['focus'],
    ['success-soft', 'success-fg'], ['info-soft', 'info-fg'], ['warning-soft', 'warning-fg'], ['error-soft', 'error-fg'],
    ['data-1'], ['data-2'], ['data-3'], ['data-4'], ['data-user'], ['data-pos'], ['data-neg']
  ];
  var text = [
    ['ink', 'surface-base', 'Body text'], ['ink', 'surface-canvas', 'Body on the page'], ['ink', 'surface-sunken', 'Body in a well'], ['ink-strong', 'surface-base', 'Headings'],
    ['ink-muted', 'surface-base', 'Secondary text'], ['ink-muted', 'surface-sunken', 'Secondary in a well'], ['ink-muted', 'surface-hover', 'Secondary, hovered row'], ['ink-muted', 'surface-pressed', 'Secondary, pressed row'],
    ['ink-muted', 'surface-float', 'Secondary in a menu'], ['ink', 'user-soft', 'Body on a chosen row'], ['ink-muted', 'user-soft', 'Secondary, chosen row'], ['ink-inverse', 'surface-inverse', 'Tooltip'],
    ['user-on', 'user', 'Primary button'], ['user-on', 'user-hover', 'Primary, hover'], ['user-ink', 'surface-base', 'Accent text'], ['user-ink', 'user-soft', 'Text on a chosen item'],
    ['ink-action-on', 'ink-action', 'Secondary button'], ['machine-ink', 'surface-base', 'Machine text'], ['machine-ink', 'machine-soft', 'Machine chip'],
    ['success-fg', 'success-soft', 'Success, soft'], ['success-on', 'success-solid', 'Success, solid'], ['info-fg', 'info-soft', 'Info, soft'], ['info-on', 'info-solid', 'Info, solid'],
    ['warning-fg', 'warning-soft', 'Warning, soft'], ['warning-on', 'warning-solid', 'Warning, solid'], ['error-fg', 'error-soft', 'Error, soft'], ['error-on', 'error-solid', 'Error, solid'],
    ['error-text', 'surface-base', 'Error message'], ['error-on-inverse', 'surface-inverse', 'Error on inverse']
  ];
  var graphic = [
    ['line-strong', 'surface-base', 'Control edge, chart axis'], ['line-strong', 'surface-sunken', 'Control edge, chart axis in a well'], ['focus', 'surface-base', 'Focus ring'], ['focus', 'surface-sunken', 'Focus in a well'],
    ['focus', 'user-soft', 'Focus on a chosen item'], ['focus-inverse', 'surface-inverse', 'Focus on the inverse surface'], ['user', 'surface-base', 'Checked control'], ['user-line', 'user-soft', 'Selection edge'], ['machine', 'surface-base', 'Progress'],
    ['data-1', 'surface-base', 'Series 1'], ['data-2', 'surface-base', 'Series 2'], ['data-3', 'surface-base', 'Series 3'], ['data-4', 'surface-base', 'Series 4'],
    ['data-user', 'surface-base', 'Your own value'], ['data-pos', 'surface-base', 'Positive delta'], ['data-neg', 'surface-base', 'Negative delta']
  ];

  function fill(pane) {
    var el = pane.el, base = solid(el, 'surface-base');
    el.querySelector('[data-swatches]').innerHTML = swatches.map(function (s) {
      var c = solid(el, s[0]), on = s[1] ? solid(el, s[1]) : null;
      var note = on ? on + ' on it, ' + ratio(on, c).toFixed(2) : (s[0].indexOf('surface') === 0 ? c : c + ', ' + ratio(c, base).toFixed(2) + ' on base');
      return '<div class="swatch"><i style="--c:' + c + (on ? ';--on:' + on : '') + '">' + (on ? 'Aa' : '') + '</i><span><b>' + s[0] + '</b><span class="meta num">' + note + '</span></span></div>';
    }).join('');
    var lo = [99, 99], fails = 0;
    var rows = text.map(function (r) { return [r, 4.5, false]; }).concat(graphic.map(function (r) { return [r, 3, true]; })).map(function (x) {
      var r = x[0], bg = solid(el, r[1]), fg = tok(el, r[0]).length > 7 ? over(tok(el, r[0]), bg) : tok(el, r[0]);
      var v = ratio(fg, bg), i = x[2] ? 1 : 0; lo[i] = Math.min(lo[i], v); if (v < x[1]) fails++;
      return '<div><span class="aa' + (x[2] ? ' g' : '') + '" style="background:' + bg + ';color:' + fg + ';--fg:' + fg + '" aria-hidden="true">Aa</span><span>' + r[2] + '<br><span class="meta">' + r[0] + ' on ' + r[1].replace('surface-', '') + '</span></span><span class="v' + (v < x[1] ? ' fail' : '') + '">' + v.toFixed(2) + '</span></div>';
    });
    el.querySelector('[data-cr]').innerHTML = rows.join('');
    el.querySelector('[data-cr-note]').textContent = (fails ? fails + ' pairs fail. ' : 'All ' + rows.length + ' pairs pass WCAG 2.2 AA. ') + 'Lowest text pair ' + lo[0].toFixed(2) + ' (needs 4.5); lowest control, focus or chart pair ' + lo[1].toFixed(2) + ' (needs 3). Computed in this browser from the tokens.';
    el.querySelectorAll('[data-ms]').forEach(function (s) { s.textContent = tok(el, s.getAttribute('data-ms').slice(5)); });
  }
  panes.forEach(fill);

  /* ---- segmented controls: click and arrow keys, the thumb glides ---- */
  function wireSeg(seg, onPick) {
    var btns = Array.prototype.slice.call(seg.querySelectorAll('button'));
    function pick(i, focus) {
      btns.forEach(function (b, j) { b.setAttribute('aria-checked', j === i ? 'true' : 'false'); b.tabIndex = j === i ? 0 : -1; });
      seg.style.setProperty('--k', i); if (focus) btns[i].focus(); if (onPick) onPick(btns[i], i);
    }
    btns.forEach(function (b, i) {
      b.addEventListener('click', function () { pick(i); });
      b.addEventListener('keydown', function (e) {
        var rtl = getComputedStyle(seg).direction === 'rtl', k = e.key, n = btns.length, j = null;
        if (k === 'ArrowRight') j = rtl ? i - 1 : i + 1; else if (k === 'ArrowLeft') j = rtl ? i + 1 : i - 1; else if (k === 'Home') j = 0; else if (k === 'End') j = n - 1;
        if (j !== null) { e.preventDefault(); pick((j + n) % n, true); }
      });
    });
    return pick;
  }
  document.querySelectorAll('[data-seg]').forEach(function (s) { wireSeg(s); });
  wireSeg(document.getElementById('density'), function (b) { document.documentElement.setAttribute('data-ds-density', b.getAttribute('data-v')); });

  document.querySelectorAll('[data-chip]').forEach(function (c) { c.addEventListener('click', function () { c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); }); });

  /* ---- table selection and the bulk-action bar ---- */
  panes.forEach(function (pane) {
    var el = pane.el, all = el.querySelector('[data-all]'), bulk = el.querySelector('[data-bulk]'), count = el.querySelector('[data-count]');
    var boxes = Array.prototype.slice.call(el.querySelectorAll('[data-rows] .cbx'));
    function sync() {
      var n = boxes.filter(function (b) { return b.checked; }).length;
      boxes.forEach(function (b) { b.closest('tr').classList.toggle('is-chosen', b.checked); });
      all.checked = n === boxes.length; all.indeterminate = n > 0 && n < boxes.length;
      bulk.hidden = n === 0; count.textContent = n + ' selected';
    }
    boxes.forEach(function (b) { b.addEventListener('change', sync); });
    all.addEventListener('change', function () { boxes.forEach(function (b) { b.checked = all.checked; }); sync(); });
    el.querySelector('[data-clear]').addEventListener('click', function () { boxes.forEach(function (b) { b.checked = false; }); sync(); all.focus(); });
    sync();
  });

  /* ---- the dashboard: the user's own months and their own target. Every figure, summary and label is written from this one set ---- */
  var sets = [[28, 35, 31, 42, 40, 43], [33, 41, 37, 45, 43, 38], [30, 36, 33, 41, 42, 46]];
  var goal = 50, target = 45;
  function points(v) {
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), span = hi - lo || 1;
    return v.map(function (n, i) { return (4 + i * 46) + ',' + (44 - (n - lo) / span * 34).toFixed(1); });
  }
  function paint(k) {
    var s = sets[k], now = s[5], d = now - s[4], pct = Math.round(now / goal * 100), pts = points(s), end = pts[5].split(',');
    function share(v) { return v / goal * 100; }
    document.querySelectorAll('[data-plot]').forEach(function (p) {
      Array.prototype.forEach.call(p.children, function (b, i) { b.style.setProperty('--v', share(s[i])); });
      p.setAttribute('aria-label', 'Requests you closed on time in each of the last six months, out of ' + goal + ' each month: ' + s.slice(0, 5).join(', ') + ', then ' + now + ' this month.');
    });
    document.querySelectorAll('[data-mini]').forEach(function (p) { Array.prototype.forEach.call(p.children, function (b, i) { b.style.setProperty('--v', share(sets[(k + 1) % 3][i + 1])); }); });
    document.querySelectorAll('[data-kpi]').forEach(function (f) { f.textContent = now + ' of ' + goal; });
    document.querySelectorAll('[data-delta]').forEach(function (e) {
      e.className = 'delta' + (d < 0 ? ' down' : '');
      e.innerHTML = '<svg class="i s20"><use href="#i-up"/></svg><bdi dir="ltr">' + (d < 0 ? '' : '+') + d + '</bdi> against last month, ' + (d < 0 ? 'worse' : 'better');
    });
    document.querySelectorAll('[data-meter]').forEach(function (m) {
      m.style.setProperty('--v', pct);
      m.setAttribute('aria-label', now + ' of your ' + goal + ' requests closed on time, against a target of ' + target + '.');
    });
    document.querySelectorAll('[data-note]').forEach(function (t) { t.textContent = pct + '%, against a target of ' + target + ' of ' + goal + ' (' + Math.round(target / goal * 100) + '%).'; });
    document.querySelectorAll('[data-spark]').forEach(function (g) {
      g.querySelector('polyline').setAttribute('points', pts.join(' '));
      g.querySelector('circle').setAttribute('cx', end[0]);
      g.querySelector('circle').setAttribute('cy', end[1]);
