<!doctype html>
<html lang="en" data-ds-theme>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat UI preview</title>
<!-- One self-contained page: tokens.css, tokens-dark.css and motion.css are inlined verbatim between the BEGIN and END markers, so it opens anywhere with no network requests. Re-copy them when a token file changes. Fonts are named in the tokens and fall back to the system. -->
<style>
/* BEGIN tokens.css */
/* Agent Chat UI design tokens, 2.0.0. Generic, unbranded, values-only.
   Scope: any element with a data-ds-theme attribute. Light is the default; load tokens-dark.css and set data-ds-theme="dark" for the opt-in dark theme.
   Components read ROLES (surface, ink, line, user, machine, status, focus), never palette steps, so one set of names serves both themes.
   Contrast for every role pair, light and dark, is in guidelines.md. */

[data-ds-theme] {
  /* ===== palette ===== */
  --ds-color-gold-50: #F9F7ED;
  --ds-color-gold-100: #F2ECCF;
  --ds-color-gold-200: #E6D7A2;
  --ds-color-gold-300: #D7BC6D;
  --ds-color-gold-400: #CBA344;
  --ds-color-gold-500: #B68A35;   /* accent only, never under white text (3.15:1) */
  --ds-color-gold-600: #92722A;   /* white on it 4.50:1 */
  --ds-color-gold-700: #7C5E24;   /* white on it 6.03:1 */
  --ds-color-gold-edge: #EBDFBF;

  --ds-color-neutral-0: #FFFFFF;
  --ds-color-neutral-25: #FCFCFC;
  --ds-color-neutral-50: #F7F7F7;
  --ds-color-neutral-100: #E1E3E5;
  --ds-color-neutral-200: #C3C6CB;
  --ds-color-neutral-300: #9EA2A9;
  --ds-color-neutral-400: #797E86;
  --ds-color-neutral-500: #5F646D;
  --ds-color-neutral-600: #4B4F58;
  --ds-color-neutral-700: #3E4046;
  --ds-color-neutral-800: #232528;
  --ds-color-neutral-900: #1B1D21;
  --ds-color-neutral-950: #0E0F12;

  --ds-color-blue-50: #EEF5FB;
  --ds-color-blue-100: #DFECF7;
  --ds-color-blue-200: #9FC0DA;
  --ds-color-blue-300: #86B7E1;
  --ds-color-blue-600: #2C6A9B;

  --ds-color-red-50: #FEF2F2;
  --ds-color-red-200: #FDCDCB;
  --ds-color-red-300: #FAAAA7;
  --ds-color-red-600: #D83731;
  --ds-color-red-700: #B52520;
  --ds-color-green-50: #F3FAF4;
  --ds-color-green-300: #A0D5AB;
  --ds-color-green-600: #3F8E50;
  --ds-color-green-700: #2F663C;

  --ds-color-amber-500: #F29F10;  /* focus ring, dark */
  --ds-color-amber-600: #D67907;  /* the 1.x focus ring: 2.97:1 on the quiet well, so retired */
  --ds-color-amber-700: #B2550A;  /* focus ring, light */

  /* ===== roles: light (the default) ===== */
  --ds-surface: var(--ds-color-neutral-0);           /* the page, the dock, the thread */
  --ds-surface-quiet: var(--ds-color-neutral-50);    /* a well: filled chip, code, table head, hover, selected row */
  --ds-surface-raised: var(--ds-color-neutral-0);    /* cards and the message box, lifted by elevation */
  --ds-surface-overlay: var(--ds-color-neutral-0);   /* popovers, the tooltip, the popup window */
  --ds-surface-side: var(--ds-color-neutral-25);
  --ds-ink: var(--ds-color-neutral-800);             /* 15.37:1 */
  --ds-ink-muted: var(--ds-color-neutral-500);       /* 5.95:1; 5.55:1 on the quiet well */
  --ds-ink-faint: var(--ds-color-neutral-300);       /* disabled only, never meaning */
  --ds-line: var(--ds-color-neutral-100);
  --ds-line-strong: var(--ds-color-neutral-200);
  --ds-line-bold: var(--ds-color-neutral-300);
  /* The user: the accent hue marks the user and nothing else (their bubble, the message box, their avatar, where they are, their choice, their own action) */
  --ds-user-strong: var(--ds-color-gold-600);
  --ds-user-strong-hover: var(--ds-color-gold-700);
  --ds-user-on-strong: var(--ds-color-neutral-0);
  --ds-user-idle: var(--ds-color-gold-200);
  --ds-user-bg: var(--ds-color-gold-50);
  --ds-user-bg-hover: var(--ds-color-gold-100);
  --ds-user-edge: var(--ds-color-gold-edge);
  --ds-user-mark: var(--ds-color-gold-500);
  --ds-user-ink: var(--ds-color-gold-700);         /* 5.61:1 on the user's ground */
  /* The machine: anything the assistant or a helper produced */
  --ds-machine: var(--ds-color-blue-600);            /* links, the streaming caret, activity: 5.77:1 */
  --ds-machine-rule: var(--ds-color-blue-200);       /* the 2px rule beside the assistant's words */
  --ds-machine-soft: var(--ds-color-blue-100);
  --ds-machine-tint: var(--ds-color-blue-50);
  --ds-error-bg: var(--ds-color-red-50);
  --ds-error-line: var(--ds-color-red-200);
  --ds-error-ink: var(--ds-color-red-700);
  --ds-success-bg: var(--ds-color-green-50);
  --ds-success-ink: var(--ds-color-green-700);
  --ds-focus: var(--ds-color-amber-700);             /* 4.66 to 5.00:1 on every light surface */

  /* ===== type: a minor third (x1.2) from 16, named roles =====
     footnote 14 (step -1) · body 16 · name 17 (half step) · heading 20 (step 1) · title 24-28 (step 3, fluid) · greeting 28-34 (step 4, fluid).
     Families by name only; nothing is shipped. Every family ends in a system fallback. */
  --ds-font-body: "Roboto", ui-sans-serif, system-ui, sans-serif;
  --ds-font-heading: "Inter", ui-sans-serif, system-ui, sans-serif;
  --ds-font-body-rtl: "Noto Kufi Arabic", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  --ds-font-heading-rtl: "Alexandria", "Noto Kufi Arabic", Tahoma, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ds-size-footnote: 0.875rem;
  --ds-size-body: 1rem;
  --ds-size-name: 1.0625rem;
  --ds-size-heading: 1.25rem;
  --ds-size-title: clamp(1.5rem, 1.1rem + 1.1cqi, 1.75rem);
  --ds-size-greeting: clamp(1.75rem, 1.25rem + 1.2cqi, 2.125rem);

  /* ===== space and shape ===== */
  --ds-space-unit: 4px;
  --ds-space-1: 0.25rem; --ds-space-2: 0.5rem; --ds-space-3: 0.75rem; --ds-space-4: 1rem; --ds-space-6: 1.5rem; --ds-space-8: 2rem; --ds-space-12: 3rem;
  --ds-radius-control: 0.5rem;
  --ds-radius-bubble: 0.625rem;
  --ds-radius-card: 0.75rem;
  --ds-radius-window: 1rem;
  --ds-radius-pill: 9999px;
  --ds-target-min: 32px;          /* nothing smaller; WCAG 2.2 asks for 24 */
  --ds-focus-width: 2px;
  --ds-focus-offset: 2px;
  --ds-rail-width: 56px;
  --ds-face: 2.5rem;
  --ds-face-greeting: 7.5rem;
  --ds-greeting-width: 600px;
  --ds-popup-width: 24rem;
  --ds-popup-height: 600px;
  --ds-sidebar-width: 28rem;
  --ds-header-height: 64px;

  /* ===== elevation and material: five levels, one job each ===== */
  --ds-elevation-0: none;                                                                             /* ground */
  --ds-elevation-1: 0 1px 2px rgb(14 15 18 / 0.06), 0 1px 3px rgb(14 15 18 / 0.04);                  /* raised: cards */
  --ds-elevation-2: 0 2px 4px rgb(14 15 18 / 0.05), 0 8px 20px -6px rgb(14 15 18 / 0.12);            /* floating: toggle, jump, tooltip */
  --ds-elevation-3: 0 4px 8px rgb(14 15 18 / 0.05), 0 18px 40px -12px rgb(14 15 18 / 0.20);          /* overlay: popovers */
  --ds-elevation-4: 0 8px 16px rgb(14 15 18 / 0.06), 0 28px 64px -16px rgb(14 15 18 / 0.26);         /* window: the popup */
  --ds-material-glass: rgb(255 255 255 / 0.90);      /* small floating layers only; text stays AA even over pure black */
  --ds-material-filter: blur(20px) saturate(1.25);
  --ds-material-edge: rgb(14 15 18 / 0.08);
  --ds-dock-edge: inset -1px 0 0 var(--ds-line), inset -6px 0 12px -10px rgb(14 15 18 / 0.18);
  --ds-dock-edge-rtl: inset 1px 0 0 var(--ds-line), inset 6px 0 12px -10px rgb(14 15 18 / 0.18);

  /* ===== motion: one calm tempo ===== */
  --ds-duration-quick: 120ms;     /* hover tints, a tooltip, anything leaving */
  --ds-duration-control: 200ms;   /* focus, press, the send colour */
  --ds-duration-content: 400ms;   /* a message arriving, a popover */
  --ds-duration-card: 450ms;      /* the dock folding to the rail */
  --ds-duration-travel: 700ms;    /* the message box travelling from the greeting into the dock */
  --ds-ease: cubic-bezier(.22, 1, .36, 1);        /* enter and settle */
  --ds-ease-exit: cubic-bezier(.4, 0, 1, 1);      /* accelerate away */
  --ds-ease-move: cubic-bezier(.65, 0, .35, 1);   /* something on screen changing size or place */
  --ds-ease-spring: var(--ds-ease);               /* the travel; replaced by a sampled spring below where linear() is supported */
  --ds-motion-rise: 8px;
  --ds-motion-pop-scale: 0.98;
  --ds-activity-cycle: 1.4s;
  --ds-spinner-cycle: 1s;

  /* ===== 1.x names, kept as aliases for this major version; new work uses the names above ===== */
  --ds-color-focus: var(--ds-focus);
  --ds-size-chat-text: var(--ds-size-body); --ds-line-chat-text: 1.5rem;
  --ds-size-meta: var(--ds-size-footnote); --ds-line-meta: 1.25rem;
  --ds-shadow-sm: var(--ds-elevation-1); --ds-shadow-md: var(--ds-elevation-2); --ds-shadow-lg: var(--ds-elevation-3); --ds-shadow-window: var(--ds-elevation-4);
  --ds-motion-activity: var(--ds-activity-cycle); --ds-motion-spinner: var(--ds-spinner-cycle);
  --ds-motion-window-open: var(--ds-duration-control); --ds-ease-standard: var(--ds-ease);
  --ds-control-height-sm: 2.5rem; --ds-control-height-xs: 2rem; --ds-control-padding-x: 1.5rem;
}

@supports (transition-timing-function: linear(0, 1)) {
  /* 0.93% overshoot, settles by 700ms, never a bounce */
  [data-ds-theme] { --ds-ease-spring: linear(0, 0.049 4.2%, 0.163 8.3%, 0.303 12.5%, 0.444 16.7%, 0.574 20.8%, 0.686 25%, 0.777 29.2%, 0.848 33.3%, 0.902 37.5%, 0.941 41.7%, 0.969 45.8%, 0.987 50%, 0.998 54.2%, 1.005 58.3%, 1.008 62.5%, 1.009 66.7%, 1.009 70.8%, 1.008 75%, 1.007 79.2%, 1.006 83.3%, 1.004 87.5%, 1.003 91.7%, 1.002 95.8%, 1); }
}

/* Direction: families and leading follow the text direction. Left to right is the default; Arabic takes taller leading (body 16/28) and is never tracked.
   Separate rules on purpose, so a browser without :dir() still honours an explicit dir attribute. */
[data-ds-theme], [data-ds-theme] [dir="ltr"] {
  --ds-family-text: var(--ds-font-body); --ds-family-display: var(--ds-font-heading);
  --ds-leading-footnote: 1.25rem; --ds-leading-body: 1.5rem; --ds-leading-name: 1.5rem; --ds-leading-heading: 1.75rem;
  --ds-leading-title: 1.2857; --ds-leading-greeting: 1.2941; --ds-tracking-display: -0.01em;
}
[data-ds-theme]:dir(rtl) {
  --ds-family-text: var(--ds-font-body-rtl); --ds-family-display: var(--ds-font-heading-rtl);
  --ds-leading-footnote: 1.5rem; --ds-leading-body: 1.75rem; --ds-leading-name: 1.75rem; --ds-leading-heading: 2rem;
  --ds-leading-title: 1.4286; --ds-leading-greeting: 1.4118; --ds-tracking-display: 0;
}
[data-ds-theme][dir="rtl"], [data-ds-theme] [dir="rtl"] {
  --ds-family-text: var(--ds-font-body-rtl); --ds-family-display: var(--ds-font-heading-rtl);
  --ds-leading-footnote: 1.5rem; --ds-leading-body: 1.75rem; --ds-leading-name: 1.75rem; --ds-leading-heading: 2rem;
  --ds-leading-title: 1.4286; --ds-leading-greeting: 1.4118; --ds-tracking-display: 0;
}
/* Type roles, used as font shorthands: font: var(--ds-type-body). Nothing below body except the footnote. */
[data-ds-theme], [data-ds-theme] [dir] {
  --ds-type-footnote: 400 var(--ds-size-footnote)/var(--ds-leading-footnote) var(--ds-family-text);
  --ds-type-body: 400 var(--ds-size-body)/var(--ds-leading-body) var(--ds-family-text);
  --ds-type-body-strong: 500 var(--ds-size-body)/var(--ds-leading-body) var(--ds-family-text);
  --ds-type-name: 600 var(--ds-size-name)/var(--ds-leading-name) var(--ds-family-display);
  --ds-type-heading: 600 var(--ds-size-heading)/var(--ds-leading-heading) var(--ds-family-display);
  --ds-type-title: 700 var(--ds-size-title)/var(--ds-leading-title) var(--ds-family-display);
  --ds-type-greeting: 700 var(--ds-size-greeting)/var(--ds-leading-greeting) var(--ds-family-display);
  --ds-type-code: 400 0.9375rem/1.5rem var(--ds-font-mono); /* 15/24 mono reads as 16 body */
}

/* Density: space and targets, never type. Comfortable is the default. */
[data-ds-theme], [data-ds-density="comfortable"] {
  --ds-dock-width: 400px; --ds-panel-padding: 1.125rem; --ds-message-gap: 0.875rem;
  --ds-bubble-padding-y: 0.5rem; --ds-bubble-padding-x: 1rem; --ds-card-padding: 1.5rem;
  --ds-control-height: 3rem; --ds-chip-height: 2.5rem; --ds-icon-button: 2.25rem; --ds-icon-button-dock: 2rem; --ds-row-height: 3rem;
}
[data-ds-density="compact"] {
  --ds-dock-width: 380px; --ds-panel-padding: 0.875rem; --ds-message-gap: 0.625rem;
  --ds-bubble-padding-y: 0.375rem; --ds-bubble-padding-x: 0.75rem; --ds-card-padding: 1.125rem;
  --ds-control-height: 2.5rem; --ds-chip-height: 2.25rem; --ds-icon-button: 2rem; --ds-icon-button-dock: 2rem; --ds-row-height: 2.5rem;
}
[data-ds-density="touch"] {
  --ds-dock-width: 440px; --ds-panel-padding: 1.25rem; --ds-message-gap: 1rem;
  --ds-bubble-padding-y: 0.625rem; --ds-bubble-padding-x: 1.125rem; --ds-card-padding: 1.5rem;
  --ds-control-height: 3rem; --ds-chip-height: 2.75rem; --ds-icon-button: 2.75rem; --ds-icon-button-dock: 2.75rem; --ds-row-height: 3.25rem;
}

/* The user's system settings, honoured at the token level */
@media (prefers-reduced-motion: reduce) {
  [data-ds-theme] {
    --ds-duration-control: var(--ds-duration-quick); --ds-duration-content: var(--ds-duration-quick);
    --ds-duration-card: 0ms; --ds-duration-travel: 0ms; --ds-motion-rise: 0px; --ds-motion-pop-scale: 1;
  }
}
@media (prefers-reduced-transparency: reduce) {
  [data-ds-theme] { --ds-material-glass: var(--ds-surface-overlay); --ds-material-filter: none; }
}
@media (prefers-contrast: more) {
  [data-ds-theme] {
    --ds-line: var(--ds-color-neutral-400); --ds-line-strong: var(--ds-color-neutral-500); --ds-line-bold: var(--ds-color-neutral-600);
    --ds-ink-muted: var(--ds-color-neutral-600); --ds-user-edge: var(--ds-color-gold-500); --ds-machine-rule: var(--ds-color-blue-600);
    --ds-material-glass: var(--ds-surface-overlay);
  }
}
@media (forced-colors: active) {
  /* Shadows and fills disappear: floating layers need a real border (see guidelines.md) and the glass stops blurring */
  [data-ds-theme] { --ds-material-filter: none; }
}
/* END tokens.css */
</style>
<style>
/* BEGIN tokens-dark.css */
/* Agent Chat UI, dark theme, 2.0.0. OPT-IN: not imported by tokens.css. Load it after tokens.css and set data-ds-theme="dark" on the element that should be dark.
   Light stays the default everywhere. The same role names as tokens.css, so every component follows without a second stylesheet.
   Tints are a palette colour at a stated opacity over the dark ground, flattened to hex so they never shift with what is behind them.
   The accent still marks the user and nothing else. Every text pair is 4.5:1 or better and every control and ring 3:1 or better; the table is in guidelines.md. */
[data-ds-theme="dark"] {
  --ds-surface: var(--ds-color-neutral-900);        /* #1B1D21 */
  --ds-surface-quiet: var(--ds-color-neutral-800);  /* wells read lighter than the ground in the dark */
  --ds-surface-raised: var(--ds-color-neutral-800);
  --ds-surface-overlay: #2C2E30;                    /* white 4% over neutral-800: popovers one step above cards */
  --ds-surface-side: var(--ds-color-neutral-950);
  --ds-ink: var(--ds-color-neutral-100);            /* 13.12:1; softer than white, no halation */
  --ds-ink-muted: var(--ds-color-neutral-300);      /* 6.59:1; 6.00:1 on a well */
  --ds-ink-faint: var(--ds-color-neutral-600);      /* disabled only */
  --ds-line: var(--ds-color-neutral-700);
  --ds-line-strong: var(--ds-color-neutral-600);
  --ds-line-bold: var(--ds-color-neutral-400);
  --ds-user-strong: var(--ds-color-gold-400);     /* 7.12:1; carries dark ink, never white (white on it is 2.37:1) */
  --ds-user-strong-hover: var(--ds-color-gold-300);
  --ds-user-on-strong: var(--ds-color-neutral-900);
  --ds-user-idle: #463B27;                        /* gold-500 28% over the ground */
  --ds-user-bg: #312C24;                          /* gold-500 14% */
  --ds-user-bg-hover: #3D3525;                    /* gold-500 22% */
  --ds-user-edge: #4D4027;                        /* gold-500 32% */
  --ds-user-mark: var(--ds-color-gold-500);
  --ds-user-ink: var(--ds-color-gold-100);        /* 11.66:1 on the user's ground */
  --ds-machine: var(--ds-color-blue-300);           /* 7.94:1 */
  --ds-machine-rule: var(--ds-color-blue-600);
  --ds-machine-soft: #1F2F3E;                       /* blue-600 24% */
  --ds-machine-tint: #1D2832;                       /* blue-600 14% */
  --ds-error-bg: #3D2224;                           /* red-600 18% */
  --ds-error-line: #702928;                         /* red-600 45% */
  --ds-error-ink: var(--ds-color-red-300);          /* 7.83:1 */
  --ds-success-bg: #213129;                         /* green-600 18% */
  --ds-success-ink: var(--ds-color-green-300);      /* 8.20:1 */
  --ds-focus: var(--ds-color-amber-500);            /* 6.32 to 7.83:1 on every dark surface */

  /* Depth in the dark: each level adds a 1px rim of light along its top edge and a deeper shadow; surfaces step lighter as they rise */
  --ds-elevation-1: inset 0 1px 0 rgb(255 255 255 / 0.04), 0 1px 2px rgb(0 0 0 / 0.40);
  --ds-elevation-2: inset 0 1px 0 rgb(255 255 255 / 0.06), 0 2px 4px rgb(0 0 0 / 0.30), 0 8px 20px -6px rgb(0 0 0 / 0.55);
  --ds-elevation-3: inset 0 1px 0 rgb(255 255 255 / 0.07), 0 4px 8px rgb(0 0 0 / 0.30), 0 18px 40px -12px rgb(0 0 0 / 0.65);
  --ds-elevation-4: inset 0 1px 0 rgb(255 255 255 / 0.08), 0 8px 16px rgb(0 0 0 / 0.35), 0 28px 64px -16px rgb(0 0 0 / 0.70);
  --ds-material-glass: rgb(40 42 44 / 0.94);        /* text stays AA even over pure white */
  --ds-material-edge: rgb(255 255 255 / 0.08);
  --ds-dock-edge: inset -1px 0 0 var(--ds-line), inset -8px 0 16px -12px rgb(0 0 0 / 0.70);
  --ds-dock-edge-rtl: inset 1px 0 0 var(--ds-line), inset 8px 0 16px -12px rgb(0 0 0 / 0.70);

  color-scheme: dark;
}
@media (prefers-reduced-transparency: reduce) {
  [data-ds-theme="dark"] { --ds-material-glass: var(--ds-surface-overlay); }
}
@media (prefers-contrast: more) {
  [data-ds-theme="dark"] {
    --ds-line: var(--ds-color-neutral-400); --ds-line-strong: var(--ds-color-neutral-300); --ds-line-bold: var(--ds-color-neutral-200);
    --ds-ink: var(--ds-color-neutral-0); --ds-ink-muted: var(--ds-color-neutral-200);
    --ds-user-edge: var(--ds-color-gold-400); --ds-machine-rule: var(--ds-color-blue-300);
    --ds-material-glass: var(--ds-surface-overlay);
  }
}
/* END tokens-dark.css */
</style>
<style>
/* BEGIN motion.css */
/* Agent Chat UI motion, 2.0.0. Optional: the four transitions that earn their place, and the two status loops, as classes a chat framework's slots accept.
   Reads only the motion tokens in tokens.css, so a reduced-motion setting reaches every one of them.
     .ds-arrive   a new turn rises by --ds-motion-rise and fades in, once. Never on history loaded from before.
     .ds-draw     the machine rule beside a new assistant turn draws from the top as the reply starts.
     .ds-pop      a popover grows from its anchor (the inline-start foot) and fades in.
     .ds-fade     a tooltip fades in.
     .ds-dot      one of the three activity dots; stagger them with animation-delay 0, 0.16s, 0.32s.
     .ds-spin     the spinner.
   Loops are status only. Nothing decorative loops, and the streaming caret stays still.
   Reduced motion: nothing travels or scales, loops stop, and colour or opacity keep a 120ms fade so a change is never a hard flash. */
@keyframes ds-arrive { from { opacity: 0; transform: translateY(var(--ds-motion-rise)); } to { opacity: 1; transform: none; } }
@keyframes ds-draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes ds-pop { from { opacity: 0; transform: translateY(calc(var(--ds-motion-rise) / 2)) scale(var(--ds-motion-pop-scale)); } to { opacity: 1; transform: none; } }
@keyframes ds-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ds-dot { 0%, 80%, 100% { transform: scale(.5); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
@keyframes ds-spin { to { transform: rotate(360deg); } }

.ds-arrive { animation: ds-arrive var(--ds-duration-content) var(--ds-ease) both; }
.ds-draw { transform-origin: 50% 0; animation: ds-draw var(--ds-duration-content) var(--ds-ease) both; }
.ds-pop { transform-origin: 0 100%; animation: ds-pop var(--ds-duration-content) var(--ds-ease) both; }
[dir="rtl"] .ds-pop, .ds-pop[dir="rtl"] { transform-origin: 100% 100%; }
.ds-fade { animation: ds-fade var(--ds-duration-quick) var(--ds-ease) both; }
.ds-dot { animation: ds-dot var(--ds-activity-cycle) ease-in-out infinite both; }
.ds-spin { animation: ds-spin var(--ds-spinner-cycle) linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .ds-draw, .ds-dot, .ds-spin { animation: none; }
  .ds-dot { opacity: .75; transform: none; }
}
/* END motion.css */

  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 3 5 13.5h6.5L10.5 21 19 10.5h-6.5z"/></symbol>
  <symbol id="tick" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="arrowRight" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="arrowDown" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M9 5 4 10l5 5"/><path d="M4 10h10a5 5 0 0 1 5 5v3"/></symbol>
  <symbol id="collapse" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="open" viewBox="0 0 24 24"><path d="M4 5.5h16v11H9.5L5 20v-3.5H4z"/></symbol>
  <symbol id="spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
  <symbol id="replay" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4.5h-4.5"/></symbol>
</svg>

<header class="top">
  <h1>Agent Chat UI</h1><span class="ver">2.0.0</span><span class="grow"></span>
  <button class="btn" type="button" id="replay"><svg class="i"><use href="#replay"/></svg>Replay motion</button>
</header>
<main class="pair">
  <section class="stage" data-ds-theme aria-label="Light theme"></section>
  <section class="stage" data-ds-theme="dark" aria-label="Dark theme"></section>
</main>

<script>
(() => {
  const ic = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const mirror = new Set(['send', 'arrowRight', 'collapse', 'back', 'replay']);
  const icon = (id, cls = '') => ic(id, (mirror.has(id) ? 'm ' : '') + cls);

  const T = {
    en: {
      dir: 'ltr', name: 'Assistant', helper: 'Reviewer', fold: 'Fold to the side',
      hello: 'Good morning. What do you want to do?',
      ask: 'Summarise the three open requests and draft a reply to each.',
      task: 'Drafting',
      reply: 'Three requests are open. Two need a date and one needs a cost. I drafted a reply to each.', link: 'Open the drafts',
      cardTitle: 'Send the three replies', fields: [['To', '3 people'], ['When', 'Now']], approve: 'Approve', change: 'Change', done: 'Done',
      say: 'Change the second one to Thursday.', stream: 'Changing the second reply to Thursday', phShort: 'Type what to do', working: 'Working',
      approved: 'Approved', back: 'Sent back for a change', err: 'The reply did not arrive.', retry: 'Retry', sent: 'Sent to 3 people.',
      jump: 'Jump to the latest', ph: 'Type what you want to do', modeName: 'Balanced',
      tType: 'Type, and I read it.', tSpeak: 'Microphone off. Tap to speak, and I listen.', tLive: 'Live conversation, both of us talking.', send: 'Send',
      greet: 'What do you want to do?', chips: [['Summarise my open requests', ''], ['Draft a reply', ''], ['Check a date', ''], ['Open the drafts', 'open']],
      modes: [['hand', 'Manual', 'I suggest. You do every step.'], ['scales', 'Balanced', 'I do the small, reversible things and ask before anything that matters.', true], ['bolt', 'Autonomous', 'I do all I am allowed to, then tell you.']],
      fixed: 'Anything with consequences always waits for you, in every mode.', modeLabel: 'Mode', footnote: 'Answers can be wrong. Check what matters.',
    },
    ar: {
      dir: 'rtl', name: 'المساعد', helper: 'المراجع', fold: 'طي إلى الجانب',
      hello: 'صباح الخير. ماذا تريد أن تفعل؟',
      ask: 'لخّص الطلبات الثلاثة المفتوحة واكتب مسودة رد لكل منها.',
      task: 'الصياغة',
      reply: 'هناك 3 طلبات مفتوحة. اثنان يحتاجان تاريخاً، وواحد يحتاج تكلفة. كتبت مسودة رد لكل منها.', link: 'افتح المسودات',
      cardTitle: 'إرسال الردود الثلاثة', fields: [['إلى', '3 أشخاص'], ['متى', 'الآن']], approve: 'موافقة', change: 'تغيير', done: 'تم',
      say: 'غيّر الثاني إلى يوم الخميس.', stream: 'أغيّر الرد الثاني إلى يوم الخميس', phShort: 'اكتب ما تريد', working: 'قيد العمل',
      jump: 'انتقل إلى الأحدث', ph: 'اكتب ما تريد أن تفعل', modeName: 'متوازن',
      tType: 'اكتب، وأنا أقرأ.', tSpeak: 'الميكروفون مغلق. اضغط لتتحدث، وأنا أستمع.', tLive: 'محادثة حيّة، نتحدث معاً.', send: 'إرسال',
    },
  };

  const box = (t, { greet = false, focus = '', short = false } = {}) => `
    <div class="box${greet ? ' greet' : ''}" role="group" aria-label="${t.ph}">
      <button class="ib mode" type="button" aria-label="${t.modeName}" aria-haspopup="dialog">${icon('scales')}</button>
      <input type="text" name="message" aria-label="${t.ph}" placeholder="${short ? t.phShort : t.ph}">
      <button class="ib${focus === 'type' ? ' focusdemo' : ''}" type="button" aria-label="${t.tType}">${icon('type')}</button>
      <span class="anchor"><button class="ib off${focus === 'speak' ? ' focusdemo' : ''}" type="button" aria-label="${t.tSpeak}" aria-pressed="false">${icon('speakOff')}</button>${focus === 'speak' ? `<span class="tip glass ds-fade" aria-hidden="true">${t.tSpeak}</span>` : ''}</span>
      <button class="ib" type="button" aria-label="${t.tLive}" aria-pressed="false">${icon('live')}</button>
      <button class="send" type="button" aria-label="${t.send}">${icon('send', 's18')}</button>
    </div>`;

  const ai = (html, { streaming = false, arrive = false } = {}) => `<p class="msg ai${streaming ? ' streaming' : ''}${arrive ? ' ds-arrive' : ''}"${arrive ? ' data-replay' : ''}><span class="rule${arrive ? ' ds-draw' : ''}"${arrive ? ' data-replay' : ''} aria-hidden="true"></span>${html}</p>`;

  const handoff = (t, state) => `<div class="handoff" role="status"><span class="face s24" aria-hidden="true"></span><span>${t.name}</span><span class="arrow">${icon('arrowRight', 's16')}</span><span class="face helper s24" aria-hidden="true"></span><span class="to">${t.helper}</span>${state === 'working' ? `<span class="task" aria-hidden="true">·</span><span class="task">${t.task}</span><span class="spin" aria-label="${t.working}">${icon('spinner', 'ds-spin s18')}</span>` : `<span class="done">${icon('tick', 's18')}<span>${t.done}</span></span>`}</div>`;
  const approval = (t) => `<div class="card"><h4>${t.cardTitle}</h4><dl>${t.fields.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
            <div class="acts"><button class="btn primary" type="button">${t.approve}</button><button class="btn outline" type="button">${t.change}</button></div></div>`;

  const thread = (t) => `
    <div class="dock" dir="${t.dir}" lang="${t.dir === 'rtl' ? 'ar' : 'en'}">
      <div class="head"><span class="face" aria-hidden="true"></span><b>${t.name}</b>
        <button class="ib" type="button" aria-label="${t.fold}">${icon('collapse')}</button></div>
      <div class="thread">
        <div class="turns" role="log" aria-live="polite" aria-label="${t.name}">
          ${t.threadHello === false ? '' : ai(t.hello)}
          <p class="msg me">${t.ask}</p>
          ${handoff(t, 'done')}
          ${ai(t.link ? `${t.reply} <a href="#" onclick="return false">${t.link}</a>` : t.reply)}
          ${approval(t)}
          ${t.say ? `<p class="msg me"><span class="mark" aria-hidden="true">${icon('speak', 's16')}</span><span>${t.say}</span></p>` : ''}
          ${ai(`${t.stream}<span class="caret" aria-hidden="true"></span>`, { streaming: true, arrive: true })}
        </div>
      </div>
      <div class="foot">${box(t, { short: true })}</div>
    </div>`;

  const rail = (t) => `<div class="rail" dir="${t.dir}"><span class="face" aria-hidden="true"></span><button class="ib" type="button" aria-label="${t.name}">${icon('open')}</button></div>`;

  const PAIRS = [
    ['Body text', 'ink', 'surface', 4.5], ['Body text on a quiet well', 'ink', 'surface-quiet', 4.5], ['Body text on an overlay', 'ink', 'surface-overlay', 4.5],
    ['Muted text', 'ink-muted', 'surface', 4.5], ['Muted text on a quiet well', 'ink-muted', 'surface-quiet', 4.5], ['Muted text on an overlay', 'ink-muted', 'surface-overlay', 4.5],
    ["The user's bubble", 'user-ink', 'user-bg', 4.5], ['Send, primary button', 'user-on-strong', 'user-strong', 4.5], ['Primary button, hover', 'user-on-strong', 'user-strong-hover', 4.5],
    ['Outline button, talk icons', 'user-ink', 'surface', 4.5], ['Link, streaming caret', 'machine', 'surface', 4.5], ['Hand-off row', 'ink', 'machine-tint', 4.5],
    ['Error', 'error-ink', 'error-bg', 4.5], ['Success', 'success-ink', 'success-bg', 4.5], ['Done word', 'success-ink', 'surface', 4.5],
    ['Message box edge', 'user-strong', 'surface', 3], ['Off microphone', 'ink-muted', 'surface-raised', 3], ['Activity', 'machine', 'surface', 3],
    ['Focus on the ground', 'focus', 'surface', 3], ['Focus on a quiet well', 'focus', 'surface-quiet', 3], ["Focus on the user's ground", 'focus', 'user-bg', 3], ['Focus on an overlay', 'focus', 'surface-overlay', 3],
  ];
  const SW = ['surface', 'surface-quiet', 'surface-overlay', 'ink', 'ink-muted', 'line-strong', 'user-strong', 'user-bg', 'user-ink', 'machine', 'machine-rule', 'machine-tint', 'error-ink', 'success-ink', 'focus'];

  const TYPES = [
    ['greeting', 'fluid 28 to 34'], ['title', 'fluid 24 to 28'], ['heading', '20/28'], ['name', '17/24'], ['body-strong', '16/24, 500'], ['body', '16/24'], ['code', '15/24 mono'], ['footnote', '14/20, footer only'],
  ];

  const EASES = [['ease', 'arrive and settle'], ['ease-exit', 'leave'], ['ease-move', 'change place'], ['ease-spring', 'travel']];
  const DURS = [['quick', 120], ['control', 200], ['content', 400], ['card', 450], ['travel', 700]];

  const ATTR = { light: 'data-ds-theme', dark: 'data-ds-theme="dark"' };
  const stage = (theme) => {
    const en = T.en, ar = T.ar;
    return `
    <header><h2>${theme === 'dark' ? 'Dark' : 'Light'}</h2><span>${ATTR[theme === 'dark' ? 'dark' : 'light']}</span></header>

    <section class="plate"><h3>Dock, thread and rail</h3>
      <div class="app"><div class="screen main">${thread(en)}</div><div class="screen side">${rail(en)}</div></div></section>

    <section class="plate"><h3>Greeting</h3>
      <div class="ground greeting"><span class="face big" aria-hidden="true"></span><p>${en.greet}</p>${box(en, { greet: true })}
        <div class="chips">${en.chips.map(([c, k]) => `<button class="chip ${k}" type="button">${c}</button>`).join('')}</div></div></section>

    <section class="plate"><h3>Mode picker</h3>
      <div class="ground"><div class="float">
        <div class="picker glass ds-pop" role="radiogroup" aria-label="${en.modeLabel}" data-replay>
          ${en.modeHeading ? `<p class="mh">${en.modeHeading}</p>` : ''}
          ${en.modes.map(([g, n, l, on]) => `<div role="radio" aria-checked="${on ? 'true' : 'false'}" tabindex="${on ? 0 : -1}">${icon(g, 's24')}<b>${n}</b><span class="line">${l}</span>${on ? `<span class="tick">${icon('tick')}</span>` : ''}</div>`).join('')}
          <hr><p>${en.fixed}</p>
        </div>
        ${box(en)}
      </div></div></section>

    <section class="plate"><h3>Tooltip on keyboard focus</h3>
      <div class="ground" style="padding-top: 5.5rem">${box(en, { focus: 'speak' })}</div></section>

    <section class="plate"><h3>States</h3>
      <div class="states">
        ${handoff(en, 'working')}
        ${handoff(en, 'done')}
        <div class="settled" role="status"><span class="ok">${icon('tick')}</span><b>${en.approved}</b><span>${en.cardTitle}</span></div>
        <div class="settled" role="status"><span class="ok" style="color: var(--ds-ink-muted)">${icon('back')}</span><b>${en.back}</b><span>${en.cardTitle}</span></div>
        <div class="banner err" role="alert">${icon('warn')}<span>${en.err}</span><button class="btn" type="button">${en.retry}</button></div>
        <div class="banner ok" role="status">${icon('tick')}<span>${en.sent}</span></div>
      </div></section>

    <section class="plate"><h3>Depth</h3>
      <div class="ground"><div class="levels">
        ${[['0', 'ground'], ['1', 'raised'], ['2', 'floating'], ['3', 'overlay'], ['4', 'window']].map(([n, j]) => `<div class="lvl l${n}"><b>${n}</b><span>${j}</span></div>`).join('')}
      </div></div>
      <div class="glassdemo"><div class="under" aria-hidden="true">${'<i></i>'.repeat(7)}</div>
        <div class="over glass">Glass <span>${theme === 'dark' ? '94%' : '90%'}, blur 20</span></div>
        <div class="jump" style="bottom: 50%; translate: 0 50%; justify-content: flex-end; padding-inline-end: 18%; gap: var(--ds-space-2); align-items: center"><span class="glass" style="padding: var(--ds-space-2) var(--ds-space-3); border-radius: var(--ds-radius-control); box-shadow: var(--ds-elevation-2)" aria-hidden="true">${en.jump}</span><button class="glass" type="button" aria-label="${en.jump}">${icon('arrowDown')}</button></div></div></section>

    <section class="plate"><h3>Motion</h3>
      <div class="curves">${EASES.map(([k, j]) => `<div class="curve" data-ease="${k}"><svg viewBox="-4 -14 108 128" aria-hidden="true"><path class="axis" d="M0 0V100H100"/><path class="path" d=""/></svg><div class="track"><span class="ball" style="--e: var(--ds-${k})"></span></div><b>${k.replace('ease-', '')}</b><span>${j}</span></div>`).join('')}</div>
      <div class="durs">${DURS.map(([k, ms]) => `<span>${k}</span><span class="bar" style="width: ${(ms / 700 * 100).toFixed(1)}%"><i style="--d: var(--ds-duration-${k})"></i></span><span>${ms}ms</span>`).join('')}</div>
      <div class="demos">
        <div class="demo"><code>.ds-arrive</code><p class="msg me ds-arrive" data-replay>${en.say || en.ask}</p></div>
        <div class="demo"><code>.ds-draw</code>${ai(en.hello, { streaming: true, arrive: true })}</div>
        <div class="demo"><code>.ds-pop</code><div class="card ds-pop" data-replay style="box-shadow: var(--ds-elevation-3); padding: var(--ds-space-3)"><b>${en.modeName}</b></div></div>
        <div class="demo"><code>.ds-fade</code><span class="glass ds-fade" data-replay style="align-self:flex-start; padding: var(--ds-space-2) var(--ds-space-3); border-radius: var(--ds-radius-control); box-shadow: var(--ds-elevation-2)">${en.tType}</span></div>
      </div>
      <div class="status"><span class="dots" role="status" aria-label="Working"><i class="ds-dot"></i><i class="ds-dot"></i><i class="ds-dot"></i></span><span class="spin">${icon('spinner', 'ds-spin s24')}</span></div></section>

    <section class="plate"><h3>Density</h3>
      <div class="dens">${['compact', 'comfortable', 'touch'].map((d) => `<div data-ds-density="${d}"><span>${d}</span><div class="row">${box(en)}<div class="chips">${en.chips.slice(-2).map(([c, k]) => `<button class="chip ${k}" type="button">${c}</button>`).join('')}</div></div></div>`).join('')}</div></section>

    <section class="plate"><h3>Type roles</h3>
      <div class="types"><div><span>families</span><code style="font: var(--ds-type-code); color: var(--ds-ink-muted)" data-fam></code></div>${TYPES.map(([r, s]) => `<div><span>${r}<br>${s}</span><p style="margin: 0; font: var(--ds-type-${r})">${r === 'code' ? 'font: var(--ds-type-body)' : r === 'footnote' ? en.footnote : en.greet}</p></div>`).join('')}</div>
      <div class="types" dir="rtl" lang="ar">${[['greeting', ar.hello], ['heading', ar.cardTitle], ['body', ar.reply]].map(([r, s]) => `<div><span>${r}</span><p style="margin: 0; font: var(--ds-type-${r})">${s}</p></div>`).join('')}</div></section>

    <section class="plate"><h3>Right to left</h3>
      <div class="app" dir="rtl"><div class="screen main">${thread(ar)}</div></div></section>

    <section class="plate"><h3>Roles</h3>
      <div class="swatches">${SW.map((r) => `<div class="sw"><i style="background: var(--ds-${r})"></i><span>${r}<code data-hex="${r}"></code></span></div>`).join('')}</div></section>

    <section class="plate"><h3>Contrast, measured on this page</h3>
      <table class="cr"><thead><tr><th>Pair</th><th>Sample</th><th style="text-align:end">Ratio</th><th style="text-align:end">Needs</th></tr></thead>
        <tbody>${PAIRS.map(([l, f, b, need]) => `<tr data-f="${f}" data-b="${b}" data-need="${need}"><td>${l}</td><td><span class="chipc" style="color: var(--ds-${f}); background: var(--ds-${b}); ${need === 3 ? `box-shadow: inset 0 0 0 2px var(--ds-${f}); color: transparent;` : ''}">Aa</span></td><td class="n"></td><td class="n">${need.toFixed(1)}</td></tr>`).join('')}</tbody></table></section>`;
  };

  const lum = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255].map((c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }).reduce((a, c, i) => a + c * [0.2126, 0.7152, 0.0722][i], 0); };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const hexOf = (el, name) => {
    const v = getComputedStyle(el).getPropertyValue(`--ds-${name}`).trim();
    if (/^#[0-9a-f]{6}$/i.test(v)) return v.toUpperCase();
    const probe = document.createElement('span'); probe.style.color = `var(--ds-${name})`; el.appendChild(probe);
    const m = getComputedStyle(probe).color.match(/\d+(\.\d+)?/g); probe.remove();
    return '#' + m.slice(0, 3).map((c) => (+c).toString(16).padStart(2, '0')).join('').toUpperCase();
  };

  const bezier = (x1, y1, x2, y2) => { const pts = []; for (let i = 0; i <= 60; i++) { const t = i / 60, u = 1 - t; pts.push([3 * u * u * t * x1 + 3 * u * t * t * x2 + t ** 3, 3 * u * u * t * y1 + 3 * u * t * t * y2 + t ** 3]); } return pts; };
  const curvePoints = (v) => {
    let m = v.match(/cubic-bezier\(([^)]+)\)/);
    if (m) { const [a, b, c, d] = m[1].split(',').map(Number); return bezier(a, b, c, d); }
    m = v.match(/linear\(([^)]+)\)/);
    if (m) return m[1].split(',').map((s, i, all) => { const [y, x] = s.trim().split(/\s+/); return [x ? parseFloat(x) / 100 : i / (all.length - 1), +y]; });
    return bezier(.25, .1, .25, 1);
  };

  document.querySelectorAll('.stage').forEach((st) => {
    st.innerHTML = stage(st.getAttribute('data-ds-theme'));
    st.querySelectorAll('tr[data-f]').forEach((tr) => {
      const r = ratio(hexOf(st, tr.dataset.f), hexOf(st, tr.dataset.b)), ok = r >= +tr.dataset.need;
      tr.querySelector('td.n').innerHTML = `${r.toFixed(2)}${ok ? '' : ' below'}`;
    });
    st.querySelectorAll('[data-hex]').forEach((c) => { c.textContent = hexOf(st, c.dataset.hex); });
    st.querySelectorAll('[data-fam]').forEach((c) => { const cs = getComputedStyle(st); c.textContent = `${cs.getPropertyValue('--ds-font-body').trim()} · ${cs.getPropertyValue('--ds-font-body-rtl').trim()}`; });
    st.querySelectorAll('.curve').forEach((cv) => {
      const pts = curvePoints(getComputedStyle(st).getPropertyValue(`--ds-${cv.dataset.ease}`));
      cv.querySelector('.path').setAttribute('d', 'M' + pts.map(([x, y]) => `${(x * 100).toFixed(2)} ${(100 - y * 100).toFixed(2)}`).join('L'));
    });
  });

  const settle = () => {
    document.querySelectorAll('.curve').forEach((cv) => { const tr = cv.querySelector('.track'), x = tr.clientWidth - 12; cv.querySelector('.ball').style.transform = `translateX(${getComputedStyle(tr).direction === 'rtl' ? -x : x}px)`; });
    document.querySelectorAll('.durs i').forEach((b) => { b.style.transform = 'scaleX(1)'; });
  };
  const replay = () => {
    const root = document.documentElement, again = [];
    root.classList.add('noanim');
    document.querySelectorAll('.curve .ball').forEach((b) => { b.style.transform = 'none'; });
    document.querySelectorAll('.durs i').forEach((b) => { b.style.transform = 'scaleX(0)'; });
    document.querySelectorAll('[data-replay]').forEach((el) => { const c = [...el.classList].filter((x) => x.startsWith('ds-')); el.classList.remove(...c); again.push([el, c]); });
    void document.body.offsetWidth;
    root.classList.remove('noanim');
    again.forEach(([el, c]) => el.classList.add(...c));
    requestAnimationFrame(() => requestAnimationFrame(settle));
  };
  document.getElementById('replay').addEventListener('click', replay);
  replay();
  const root = document.documentElement;
  addEventListener('resize', () => { root.classList.add('noanim'); settle(); void document.body.offsetWidth; root.classList.remove('noanim'); });
})();
</script>
</body>
</html>
